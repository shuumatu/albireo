<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/albireo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151f" />
    <script>
      // Apply the saved palette before the app and its styles load.
      ;(() => {
        let theme = 'dark'
        try {
          if (localStorage.getItem('albireo-theme') === 'light') theme = 'light'
        } catch {}
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#10151f' : '#f7f5ef'
      })()
    </script>
    <style>
      html { background: #10151f; }
      html[data-theme='light'] { background: #f7f5ef; }
    </style>
    <meta
      name="description"
      content="Albireo 个人影像档案，在时间与地图之间发现照片、视频和旅途记忆。"
    />
    <title>ALBIREO · 个人影像档案</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
